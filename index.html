<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kikundi CPM Engine</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d0d0d;
  color: #ffffff;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

video {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

input, select {
  background: #1a1a1a;
  color: #fff;
}

button {
  background: #00c27a;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #1a1a1a;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 Kikundi CPM Engine</h1>

<!-- VIDEO -->
<video controls>
  <source src="VID-20260317-WA0001.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

<!-- INPUTS -->
<label>Impressions</label>
<input type="number" id="impressions" placeholder="e.g. 1000000">

<label>Base CPM ($)</label>
<input type="number" id="baseCPM" value="1">

<label>Location</label>
<select id="location">
  <option value="tanzania">Tanzania</option>
  <option value="africa">Africa</option>
  <option value="international">International</option>
</select>

<label>Audience</label>
<select id="audience">
  <option value="general">General</option>
  <option value="social">Social</option>
  <option value="business">Business</option>
  <option value="crypto">Crypto</option>
</select>

<label>Engagement Rate (%)</label>
<input type="number" id="engagement" value="5">

<label>Trust Score</label>
<select id="trust">
  <option value="0.7">Anonymous</option>
  <option value="1">Logged In</option>
  <option value="1.5">Verified</option>
  <option value="2">Wallet Connected</option>
  <option value="3">Premium</option>
</select>

<button onclick="calculate()">Calculate CPM</button>

<!-- RESULTS -->
<div class="result" id="output">
Results will appear here...
</div>

</div>

<script>
function calculate() {

  let impressions = parseFloat(document.getElementById("impressions").value) || 0;
  let baseCPM = parseFloat(document.getElementById("baseCPM").value) || 1;
  let location = document.getElementById("location").value;
  let audience = document.getElementById("audience").value;
  let engagement = parseFloat(document.getElementById("engagement").value) || 0;
  let trust = parseFloat(document.getElementById("trust").value);

  const locationMultiplier = {
    tanzania: 0.5,
    africa: 1.0,
    international: 3.0
  };

  const audienceMultiplier = {
    general: 0.8,
    social: 1.0,
    business: 1.5,
    crypto: 3.0
  };

  let engagementMultiplier = 1 + ((engagement / 100) * 5);

  let smartCPM = baseCPM *
                 locationMultiplier[location] *
                 audienceMultiplier[audience] *
                 engagementMultiplier *
                 trust;

  let revenue = (impressions / 1000) * smartCPM;

  // TZS Conversion (approx)
  let tzs = revenue * 2500;

  document.getElementById("output").innerHTML = `
    <h2>Results</h2>
    <p><strong>Smart CPM:</strong> $${smartCPM.toFixed(2)}</p>
    <p><strong>Revenue (USD):</strong> $${revenue.toFixed(2)}</p>
    <p><strong>Revenue (TZS):</strong> ${tzs.toLocaleString()} TZS</p>
  `;
}
</script>

</body>
  </html>
